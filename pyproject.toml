[project]
name = "orderslm"
version = "0.0.1"
description = "Food-order extraction from informal chat, distilled into small open models, plus a decision-provider router benchmark."
readme = "README.md"
# Julia-1 needs 3.11+ (spec §11); 3.12 for `type` aliases (schema/order.py ToolResult).
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orderslm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # the formatter owns line length; long strings stay readable
