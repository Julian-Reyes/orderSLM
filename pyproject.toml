[project]
name = "orderslm"
version = "0.0.1"
description = "Food-order extraction from informal chat, distilled into small open models, plus a decision-provider router benchmark."
readme = "README.md"
# Julia-1 needs 3.11+ (spec §11); 3.12 for `type` aliases (schema/order.py ToolResult).
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "pydantic>=2.7,<3",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# M6 LoRA training on Apple Silicon (the Mac mini). Not installed by default; `make check` doesn't need it.
# Use with `uv run --group mlx ...` (the Makefile's smoke/train targets do this).
mlx = [
    "mlx-lm[train]==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orderslm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # the formatter owns line length; long strings stay readable
